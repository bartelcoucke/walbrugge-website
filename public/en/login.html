<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <a href="/en"><img src="/assets/img/logo-gold.png" alt="Domein Walbrugge"></a>
    </div>

    <h1 class="login-title">Log in</h1>
    <p class="login-sub">Choose below how you want to log in</p>

    <div class="login-tabs">
      <button class="login-tab active" data-tab="guest">Guest</button>
      <button class="login-tab" data-tab="admin">Administrator</button>
    </div>

    <!-- Guest Login Form -->
    <form id="guestForm" class="login-form active">
      <div class="form-group">
        <label for="guestEmail">E-mail address</label>
        <input type="email" id="guestEmail" name="email" required placeholder="name@example.com">
      </div>
      <div class="form-group">
        <label for="guestRef">Booking reference</label>
        <input type="text" id="guestRef" name="reference" required placeholder="WB-XXXXXX">
      </div>
      <button type="submit" class="btn btn-gold btn-lg btn-full">Log in as guest</button>
      <div id="guestMsg" class="login-msg" style="display:none;"></div>
    </form>

    <!-- Admin Login Form -->
    <form id="adminForm" class="login-form">
      <div class="form-group">
        <label for="adminEmail">E-mail address</label>
        <input type="email" id="adminEmail" name="email" required placeholder="admin@walbrugge.be">
      </div>
      <div class="form-group">
        <label for="adminPass">Password</label>
        <input type="password" id="adminPass" name="password" required>
      </div>
      <button type="submit" class="btn btn-green btn-lg btn-full">Log in</button>
      <div id="adminMsg" class="login-msg" style="display:none;"></div>
    </form>

    <div class="login-footer">
      <a href="/en">← Back to the website</a>
    </div>
  </div>
</div>

<script>
// Tab switching
document.querySelectorAll('.login-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
  });
});

// Check if already logged in
const token = sessionStorage.getItem('wb_token');
if (token) {
  fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token }})
    .then(r => r.json())
    .then(data => {
      if (data.ok && data.user) {
        window.location.href = data.user.role === 'admin' ? '/admin' : '/gasten/dashboard';
      }
    });
}

// Guest login
document.getElementById('guestForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('guestMsg');
  msg.style.display = 'none';

  const email = document.getElementById('guestEmail').value;
  const reference = document.getElementById('guestRef').value;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, reference })
    });
    const data = await res.json();

    if (data.ok && data.token) {
      sessionStorage.setItem('wb_token', data.token);
      sessionStorage.setItem('wb_user', JSON.stringify(data.user));
      window.location.href = data.redirect || '/gasten/dashboard';
    } else {
      msg.textContent = data.error || 'Login failed';
      msg.className = 'login-msg error';
      msg.style.display = 'block';
    }
  } catch (e) {
    msg.textContent = 'Connection error. Please try again.';
    msg.className = 'login-msg error';
    msg.style.display = 'block';
  }
});

// Admin login
document.getElementById('adminForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('adminMsg');
  msg.style.display = 'none';

  const email = document.getElementById('adminEmail').value;
  const password = document.getElementById('adminPass').value;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (data.ok && data.token) {
      sessionStorage.setItem('wb_token', data.token);
      sessionStorage.setItem('wb_user', JSON.stringify(data.user));
      window.location.href = data.redirect || '/admin';
    } else {
      msg.textContent = data.error || 'Login failed';
      msg.className = 'login-msg error';
      msg.style.display = 'block';
    }
  } catch (e) {
    msg.textContent = 'Connection error. Please try again.';
    msg.className = 'login-msg error';
    msg.style.display = 'block';
  }
});
</script>
